# lint → typecheck → unit (no services) → integration (compose --wait,
# health-gated, teardown) → falsify (every documented lever must go red —
# required from M2 on) → gitleaks (required always). Budget for the whole
# pipeline: ≤ ~5 minutes.
name: ci

on:
  push:
    branches: [main, 'defect/**']
  pull_request:

env:
  FC_SEED: '20260726'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    needs: unit
    # Fail fast everywhere except the planted-defect branches (M7): there
    # the whole point is evidence of WHICH lanes catch the bug, so the
    # integration suite must run even after a unit pin has already gone
    # red. `defect/*` is red by design either way.
    if: ${{ !cancelled() && (success() || startsWith(github.ref, 'refs/heads/defect/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: stack up (health-gated)
        run: npm run stack:up
      - run: npm run test:integration
      - name: node logs (on failure)
        if: failure()
        run: docker compose logs bitcoind
      - name: stack down
        if: always()
        run: npm run stack:down

  falsify:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: stack up (health-gated)
        run: npm run stack:up
      - name: every falsification lever must go red
        run: npm run falsify
      - name: stack down
        if: always()
        run: npm run stack:down

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
