# bitcoind is the system under test's counterparty — a pinned official
# image, never patched or forked (hard limit 1). Tag AND digest are pinned
# so a silent image change cannot alter pinned characterization behaviour;
# a deliberate version bump must come with a green run of the M1/M4/M6
# characterization tests.
#
# Deliberate choices:
#   - no volumes: chain state dies with the container — every run starts
#     from the identical regtest genesis (fresh-chain guarantee).
#   - no -fallbackfee: estimatesmartfee failing on regtest is scenario
#     FE-01's fixture, not a nuisance; tests always pass explicit fee rates.
#   - fixed test-only rpcauth (user "bct"): regenerated by
#     scripts/rpcauth.mjs, password documented in src/testing/env.ts.
#     Determinism over secrecy — this node only ever holds regtest coins
#     (hard limit 3: no real funds exist anywhere in this system).
services:
  bitcoind:
    image: bitcoin/bitcoin:31.1@sha256:da25cedc66b1daefff9f412ee196c901a899c3fa68a33b20849c3e08b5c40d63
    command:
      - bitcoind
      - -regtest=1
      - -txindex=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcauth=bct:c40d5dd1c7bb2d0e70f5070c8f4d63a9$$3af32fc02a408bc44a45ee7908250bd3ad2ec04fbd9d69fed709662da27e80d4
    ports:
      - '127.0.0.1:18443:18443'
    healthcheck:
      # Authenticates the same fixed rpcauth the tests use, so "healthy"
      # means "the suite's exact credentials work", not just "process up".
      test:
        [
          'CMD',
          'bitcoin-cli',
          '-regtest',
          '-rpcuser=bct',
          '-rpcpassword=regtest-test-only-not-a-secret',
          'getblockchaininfo',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
